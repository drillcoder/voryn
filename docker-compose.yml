services:
  postgres:
    image: postgres:16-alpine
    container_name: voryn-postgres
    environment:
      POSTGRES_USER: voryn
      POSTGRES_PASSWORD: voryn
      POSTGRES_DB: voryn
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voryn -d voryn"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: node:24-bookworm-slim
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://voryn:voryn@postgres:5432/voryn
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    command: ["sleep", "infinity"]

volumes:
  pgdata:
  node_modules:
