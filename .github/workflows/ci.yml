name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VORYN_TEST_RPC_URL: ${{ vars.VORYN_TEST_RPC_URL }}
      VORYN_TEST_CHAIN_ID: ${{ vars.VORYN_TEST_CHAIN_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare environment
        run: cp dev/.env.example dev/.env

      - name: Install dependencies
        run: make install

      - name: Start database
        run: make db-up

      - name: Build package
        run: make build

      - name: Build tests
        run: make build-test

      - name: Check package contents
        run: make pack-dry-run

      - name: Test installed package
        run: make pack-test

      - name: Lint
        run: make lint

      - name: Unit coverage
        run: make test-unit-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true

      - name: Integration tests
        run: make test-integration

      - name: E2E tests
        run: make test-e2e

      - name: Check live RPC configuration
        run: |
          if [ -z "$VORYN_TEST_RPC_URL" ]; then
            echo "VORYN_TEST_RPC_URL variable is required"
            exit 1
          fi
          if [ -z "$VORYN_TEST_CHAIN_ID" ]; then
            echo "VORYN_TEST_CHAIN_ID variable is required"
            exit 1
          fi

      - name: Live RPC tests
        run: make test-live-rpc

      - name: Clean up
        if: always()
        run: make down

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_NAME: github-actions[bot]
      GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Use npm 12
        run: npm install --global npm@12

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release
