x-node-base: &node-base
  build:
    context: .
    dockerfile: dev/Dockerfile
  working_dir: /workspace
  volumes:
    - .:/workspace
    - node_modules:/workspace/node_modules

x-worker-base: &worker-base
  <<: *node-base
  depends_on:
    postgres:
      condition: service_healthy

x-worker-env: &worker-env
  DATABASE_URL: postgres://voryn:voryn@postgres:5432/voryn
  VORYN_CHAIN_ID: ${VORYN_CHAIN_ID:?VORYN_CHAIN_ID is required}
  VORYN_LOG_LEVEL: ${VORYN_LOG_LEVEL:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: voryn-postgres
    environment:
      POSTGRES_USER: voryn
      POSTGRES_PASSWORD: voryn
      POSTGRES_DB: voryn
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voryn -d voryn"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  tools:
    <<: *node-base
    environment:
      DATABASE_URL: postgres://voryn:voryn@postgres:5432/voryn
      VORYN_CHAIN_ID: ${VORYN_CHAIN_ID:-}
      VORYN_HEAD_RPC_URL: ${VORYN_HEAD_RPC_URL:-}
      VORYN_FETCH_RPC_URL: ${VORYN_FETCH_RPC_URL:-}
      VORYN_SEQUENCER_RPC_URL: ${VORYN_SEQUENCER_RPC_URL:-}
      VORYN_METRICS_RPC_URL: ${VORYN_METRICS_RPC_URL:-}
      VORYN_RECOVERY_BLOCK: ${VORYN_RECOVERY_BLOCK:-}
      VORYN_RECOVERY_FROM_BLOCK: ${VORYN_RECOVERY_FROM_BLOCK:-}
      VORYN_RECOVERY_TO_BLOCK: ${VORYN_RECOVERY_TO_BLOCK:-}

  head:
    <<: *worker-base
    environment:
      <<: *worker-env
      VORYN_HEAD_RPC_URL: ${VORYN_HEAD_RPC_URL:?VORYN_HEAD_RPC_URL is required}
      VORYN_HEAD_DELAY_BETWEEN_TICKS_MS: ${VORYN_HEAD_DELAY_BETWEEN_TICKS_MS:-}
      VORYN_HEAD_CONFIRMATIONS: ${VORYN_HEAD_CONFIRMATIONS:-}
      VORYN_HEAD_DEPTH_BLOCKS: ${VORYN_HEAD_DEPTH_BLOCKS:-}
    command: ["npm", "exec", "--", "tsx", "--tsconfig", "dev/tsconfig.json", "dev/head.ts"]
    restart: unless-stopped

  fetch:
    <<: *worker-base
    environment:
      <<: *worker-env
      VORYN_FETCH_RPC_URL: ${VORYN_FETCH_RPC_URL:?VORYN_FETCH_RPC_URL is required}
      VORYN_FETCH_DELAY_BETWEEN_TICKS_MS: ${VORYN_FETCH_DELAY_BETWEEN_TICKS_MS:-}
      VORYN_FETCH_WORKER_ID: ${VORYN_FETCH_WORKER_ID:-}
      VORYN_FETCH_BATCH_SIZE: ${VORYN_FETCH_BATCH_SIZE:-}
      VORYN_FETCH_CLAIM_TTL_MS: ${VORYN_FETCH_CLAIM_TTL_MS:-}
      VORYN_FETCH_RETRY_MAX_ATTEMPTS: ${VORYN_FETCH_RETRY_MAX_ATTEMPTS:-}
      VORYN_FETCH_RETRY_BASE_DELAY_MS: ${VORYN_FETCH_RETRY_BASE_DELAY_MS:-}
      VORYN_FETCH_RETRY_MAX_DELAY_MS: ${VORYN_FETCH_RETRY_MAX_DELAY_MS:-}
    command: ["npm", "exec", "--", "tsx", "--tsconfig", "dev/tsconfig.json", "dev/fetch.ts"]
    restart: unless-stopped
    scale: 10

  sequencer:
    <<: *worker-base
    environment:
      <<: *worker-env
      VORYN_SEQUENCER_RPC_URL: ${VORYN_SEQUENCER_RPC_URL:-}
      VORYN_SEQUENCER_DELAY_BETWEEN_TICKS_MS: ${VORYN_SEQUENCER_DELAY_BETWEEN_TICKS_MS:-}
      VORYN_SEQUENCER_MAX_BLOCKS_PER_TICK: ${VORYN_SEQUENCER_MAX_BLOCKS_PER_TICK:-}
    command: ["npm", "exec", "--", "tsx", "--tsconfig", "dev/tsconfig.json", "dev/sequencer.ts"]
    restart: unless-stopped

  retention:
    <<: *worker-base
    environment:
      <<: *worker-env
      VORYN_RETENTION_DELAY_BETWEEN_TICKS_MS: ${VORYN_RETENTION_DELAY_BETWEEN_TICKS_MS:-}
      VORYN_RETENTION_DEPTH_BLOCKS: ${VORYN_RETENTION_DEPTH_BLOCKS:-}
    command: ["npm", "exec", "--", "tsx", "--tsconfig", "dev/tsconfig.json", "dev/retention.ts"]
    restart: unless-stopped

volumes:
  pgdata:
  node_modules:
